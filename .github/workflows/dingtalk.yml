name: 每日DCS维修值班通知

on:
  schedule:
    # 每天北京时间早上 09:00 推送（UTC 01:00）
    - cron: '55 23 * * *'
  workflow_dispatch: 

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 逻辑处理
        run: |
          # 1. 设置日期信息（北京时间）
          TODAY=$(date -d "+8 hours" +%Y-%m-%d)
          WEEKDAY=$(date -d "+8 hours" +%u)
          echo "DATE=$TODAY" >> $GITHUB_ENV

          # 2. 提取值班人员
          NAMES=$(grep "^$TODAY" duty_roster.csv | cut -d',' -f2 | tr -d '\r' | sed 's/^/  - /')

          # 提取法定假期（第三列）
          HOLIDAY=$(grep "^$TODAY" duty_roster.csv | cut -d',' -f3 | head -n 1 | tr -d '\r')

          if [ -z "$NAMES" ]; then
            NAMES="  - 今日暂无排班记录"
          fi

          # 修改点：使用 \n 替代手动换行，确保 Shell 脚本字符串拼接安全
          if [ -n "$HOLIDAY" ]; then
            NAMES="${NAMES}\n（假期不上班）"
          fi

          # 3. 转义处理
          # 注意：这里的 sed 处理是为了让多行文本能安全存入 GITHUB_ENV
          NAMES_ESCAPED=$(echo -e "$NAMES" | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "DUTY_NAMES=$NAMES_ESCAPED" >> $GITHUB_ENV

          # 4. 周六特别提醒
          SAT_MSG=""
          if [ "$WEEKDAY" -eq 6 ]; then
            SAT_MSG="\\n⚠️ 【周六特别提醒】\\n今天是周六，请曼棋、文杰、达幸、刘友、均祥记得及时填写周报！"
          fi
          echo "SATURDAY_MSG=$SAT_MSG" >> $GITHUB_ENV

      - name: 发送钉钉通知
        run: |
          curl 'https://oapi.dingtalk.com/robot/send?access_token=56ddc06470e03929034319a32eae69b41753bc98e6433abfd658ca68418e5cfa' \
          -H 'Content-Type: application/json' \
          -d '{
            "msgtype": "text",
            "text": {
              "content": "📅 DCS 维修值班提醒\n--------------------------\n🗓 日期：${{ env.DATE }}\n👤 值班人员：\n${{ env.DUTY_NAMES }}\n\n📝 任务：\n- 请及时更新HardLink平台工单\n- 值班组长请及时飞书填写《金华-DCS 维修记录表》${{ env.SATURDAY_MSG }}\n"
            }
          }'
