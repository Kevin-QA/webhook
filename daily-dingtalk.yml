name: 每日钉钉任务提醒

on:
  schedule:
    # UTC时间 01:00 = 北京时间 09:00（中国无夏令时）
    - cron: '0 1 * * *'   # 每天UTC 01:00 执行
  workflow_dispatch:      # 允许手动触发测试（非常有用）

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: 发送钉钉消息
        env:
          WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          curl -X POST "${WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "【每日任务提醒 - $(date +%Y-%m-%d)】\n\n1. 】记得喝水！"
              }
            }'